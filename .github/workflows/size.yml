name: Size

on:
  pull_request:
    branches: [main]

jobs:
  size:
    name: Bundle Size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm build

      - name: Check bundle size
        uses: preactjs/compressed-size-action@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: './packages/*/dist/*.js'
          exclude: '{**/*.d.ts,**/*.map,**/*.cjs}'
