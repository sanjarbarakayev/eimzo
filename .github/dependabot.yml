version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tashkent
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        patterns:
          - '*'
        dependency-type: development
        update-types:
          - minor
          - patch
      typescript:
        patterns:
          - typescript
          - typescript-eslint
          - '@typescript-eslint/*'
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      eslint:
        patterns:
          - eslint
          - '@eslint/*'
      vue:
        patterns:
          - vue
          - '@vue/*'
          - vue-tsc
    labels:
      - dependencies
      - automated

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
      - automated
